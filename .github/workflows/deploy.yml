# Pubblica il sito su Cloudflare Workers, ma solo se la build regge.
#
# L'ordine conta: si costruisce, si misura quel che e' stato costruito, e si
# pubblica **quello stesso** `dist/`. Non si ricostruisce dopo la verifica: i
# byte che vanno online sono gli stessi che sono passati sotto la sonda.
#
# La sonda che gira qui e' `verify:build`, non le altre. Misura la build servita
# dal runtime di Cloudflare: indirizzi, richieste di ogni pagina, invariante
# della griglia e fili dei bordi. E' l'unica che guarda la cosa pubblicata
# invece del sorgente.
#
# Serve che nei secret del repository ci siano:
#   CLOUDFLARE_API_TOKEN    permesso "Workers Scripts: Edit"
#   CLOUDFLARE_ACCOUNT_ID   l'id dell'account
#
# Due secret sono **facoltativi**, e servono solo alla playlist di /about:
#   SPOTIFY_CLIENT_ID       dall'app creata su developer.spotify.com
#   SPOTIFY_CLIENT_SECRET   della stessa app
# Senza, la build non si ferma: la playlist resta quella scritta in
# `src/data/about.ts`, e il log dice quale delle due strade ha preso.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Due push ravvicinati non devono pubblicare in ordine sbagliato. Il piu'
# recente vince, e quello in corso viene fermato.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      # Prima di spendere quattro minuti in build e verifica: le credenziali
      # ci sono? Senza questo passo il workflow muore in fondo, su un errore di
      # wrangler che non dice dove sia il problema.
      #
      # I valori non si stampano e non si possono stampare: GitHub li maschera.
      # Qui si guarda solo se sono vuoti.
      - name: Credenziali
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mancanti=()
          [ -n "$TOKEN" ] || mancanti+=(CLOUDFLARE_API_TOKEN)
          [ -n "$ACCOUNT" ] || mancanti+=(CLOUDFLARE_ACCOUNT_ID)
          if [ ${#mancanti[@]} -gt 0 ]; then
            echo "::error::Secret mancanti o vuoti: ${mancanti[*]}"
            echo "Vanno in Settings > Secrets and variables > Actions, scheda"
            echo "**Secrets** (non Variables), come secret del repository (non"
            echo "di un Environment). Il nome deve corrispondere esattamente."
            exit 1
          fi
          echo "Credenziali presenti."

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # La sonda apre le pagine in un browser vero: qui va installato.
      - run: npx playwright install --with-deps chromium

      - name: Tipi
        run: npm run check

      # Costruisce e poi misura la build servita da `wrangler dev`.
      #
      # Le credenziali Spotify arrivano qui e non al passo di pubblicazione: e'
      # la build a leggere la playlist, ed e' questo stesso `dist/` che viene
      # poi verificato e messo online.
      - name: Verifica la build
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: npm run verify:build

      - name: Pubblica
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
