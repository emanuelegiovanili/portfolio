# Pubblica il sito su Cloudflare Workers, ma solo se la build regge.
#
# L'ordine conta: si costruisce, si misura quel che e' stato costruito, e si
# pubblica **quello stesso** `dist/`. Non si ricostruisce dopo la verifica: i
# byte che vanno online sono gli stessi che sono passati sotto la sonda.
#
# La sonda che gira qui e' `verify:build`, non le altre. Misura la build servita
# dal runtime di Cloudflare: indirizzi, richieste di ogni pagina, invariante
# della griglia e fili dei bordi. E' l'unica che guarda la cosa pubblicata
# invece del sorgente.
#
# Serve che nei secret del repository ci siano:
#   CLOUDFLARE_API_TOKEN    permesso "Workers Scripts: Edit"
#   CLOUDFLARE_ACCOUNT_ID   l'id dell'account

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Due push ravvicinati non devono pubblicare in ordine sbagliato. Il piu'
# recente vince, e quello in corso viene fermato.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # La sonda apre le pagine in un browser vero: qui va installato.
      - run: npx playwright install --with-deps chromium

      - name: Tipi
        run: npm run check

      # Costruisce e poi misura la build servita da `wrangler dev`.
      - name: Verifica la build
        run: npm run verify:build

      - name: Pubblica
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
